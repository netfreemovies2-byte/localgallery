# SwiftLint configuration for Pixel Pic.
#
# Scoped to the app sources. The Rust core (core/), the Linux app
# (linux/) and generated code are out of scope: they have their own
# tooling (rustfmt/clippy) or are machine-written (the UniFFI
# bindings generated by scripts/build_core.sh).
#
# The ruleset is a curated starter set — syntax and hygiene rules
# the current tree can meaningfully adopt today — not SwiftLint's
# full default set against a large legacy codebase. The CI lint job
# is informational for now: it uploads its full report as an
# artifact and prints a summary, and does not gate the Release
# build. Tighten `only_rules` (and drop the informational status)
# as the tree converges.

included:
  - PixelPic
  - PixelPicWidgets

excluded:
  - PixelPic/GalleryCore.swift # generated UniFFI bindings (build-time only)

only_rules:
  - colon
  - comma
  - control_statement
  - duplicate_imports
  - empty_count
  - empty_enum_arguments
  - empty_parameters
  - empty_parentheses_with_trailing_closure
  - empty_string
  - file_length
  - identifier_name
  - leading_whitespace
  - legacy_constructor
  - line_length
  - mark
  - opening_brace
  - operator_whitespace
  - redundant_discardable_let
  - redundant_string_enum_value
  - redundant_void_return
  - returning_whitespace
  - shorthand_operator
  - sort_imports
  - statement_position
  - syntactic_sugar
  - trailing_comma
  - trailing_newline
  - trailing_semicolon
  - trailing_whitespace
  - unused_enumerated
  - vertical_whitespace

line_length:
  warning: 200
  error: 400
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 1400
  error: 2500

identifier_name:
  min_length: 1
  max_length: 60
  excluded:
    - id
    - x
    - y
    - w
    - h

vertical_whitespace:
  max_empty_lines: 2

reporter: "json"
