name: Build LocalGallery IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  LANGUAGE: en_US:en
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  XCODE_VERSION: "26.6"

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "${{ env.XCODE_VERSION }}"

      - name: Install Rust toolchain and iOS targets
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # 2026-09-03
        with:
          toolchain: "1.97.1"
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          rustc --version
          cargo --version
          git rev-parse --is-shallow-repository
          git rev-list --count HEAD

      - name: Install pinned XcodeGen
        run: /bin/bash scripts/install_xcodegen.sh

      - name: Stage model pack (optional)
        run: /bin/bash scripts/prepare_pack.sh --optional

      - name: Build Rust bindings and XCFramework
        run: /bin/bash scripts/build_core.sh --release

      - name: Generate Xcode project
        run: xcodegen

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          DERIVED="$ROOT/build/DerivedData"

          # Start from clean Xcode products so packaging cannot pick up stale output.
          rm -rf "$DERIVED" "$ROOT/build/ipa"
          mkdir -p "$ROOT/build"

          xcodebuild \
            -project "$ROOT/LocalGallery.xcodeproj" \
            -scheme LocalGallery \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$ROOT/xcodebuild-build.log"

          APP="$DERIVED/Build/Products/Release-iphoneos/LocalGallery.app"
          if [[ ! -d "$APP" ]]; then
            # Fallback to the exact app target product, but never package a test runner.
            APP="$(find "$DERIVED/Build/Products" -type d -name 'LocalGallery.app' -print -quit 2>/dev/null || true)"
          fi

          if [[ -z "$APP" || ! -d "$APP" || ! -f "$APP/Info.plist" ]]; then
            echo "ERROR: LocalGallery.app was not produced at the expected Release device path."
            echo "DerivedData path: $DERIVED"
            echo "App bundles found under DerivedData:"
            find "$DERIVED" -type d \( -name '*.app' -o -name '*.appex' \) -print 2>/dev/null | head -200 || true
            echo "Build settings for product paths:"
            xcodebuild \
