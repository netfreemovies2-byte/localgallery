name: Build LocalGallery IPA

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build = normal IPA build; diag = time-boxed diagnostic compile"
        required: false
        default: "build"
        type: choice
        options:
          - build
          - diag
      exclude_files:
        description: "Diag only: comma-separated repo-relative .swift files to delete before compiling (bisect)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  LANGUAGE: en_US:en
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  XCODE_VERSION: "26.6"
  # Values the packaged app is validated against (see project.yml).
  EXPECTED_BUNDLE_ID: com.j23n.localgallery.app
  EXPECTED_WIDGET_BUNDLE_ID: com.j23n.localgallery.app.widgets
  EXPECTED_MIN_OS: "18.0"
  # The Home Screen name. Checked in the built product, not just in the
  # source, so a wrong or dropped CFBundleDisplayName fails the build
  # instead of shipping an app labelled "LocalGallery".
  EXPECTED_DISPLAY_NAME: "Pixel Pic"

jobs:
  build:
    if: ${{ inputs.mode != 'diag' }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "${{ env.XCODE_VERSION }}"

      - name: Install Rust toolchain and iOS targets
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # 2026-09-03
        with:
          toolchain: "1.97.1"
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          rustc --version
          cargo --version
          git rev-parse --is-shallow-repository
          git rev-list --count HEAD

      - name: Install pinned XcodeGen
        run: /bin/bash scripts/install_xcodegen.sh

      - name: Stage model pack (optional)
        run: /bin/bash scripts/prepare_pack.sh --optional

      - name: Build Rust bindings and XCFramework
        run: /bin/bash scripts/build_core.sh --release

      - name: Generate Xcode project
        run: xcodegen

      - name: Build unsigned iOS app (Release, device)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          DERIVED="$ROOT/build/DerivedData"

          # Start from clean Xcode products so packaging cannot pick up stale output.
          rm -rf "$DERIVED" "$ROOT/build/ipa"
          mkdir -p "$ROOT/build"

          # pipefail (above) makes an xcodebuild failure fail this step even
          # though its output is piped through tee.
          xcodebuild \
            -project "$ROOT/LocalGallery.xcodeproj" \
            -scheme LocalGallery \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED" \
            -showBuildTimingSummary \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_COMPILATION_MODE=singlefile \
            SWIFT_OPTIMIZATION_LEVEL=-Onone \
            OTHER_SWIFT_FLAGS="-Xfrontend -debug-time-function-bodies" \
            build 2>&1 | tee "$ROOT/xcodebuild-build.log"

      - name: Locate and validate app bundle
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTS="$GITHUB_WORKSPACE/build/DerivedData/Build/Products"

          # Find the real product instead of guessing a path. Only the Release
          # device build may be packaged: never a simulator build or a test runner.
          APPS=()
          while IFS= read -r line; do
            APPS+=("$line")
          done < <(find "$PRODUCTS" -maxdepth 2 -type d -name 'LocalGallery.app' -path '*/Release-iphoneos/*' 2>/dev/null | sort)

          if [[ "${#APPS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one Release-iphoneos/LocalGallery.app under $PRODUCTS, found ${#APPS[@]}."
            echo "App bundles found under DerivedData:"
            find "$GITHUB_WORKSPACE/build/DerivedData" -type d \( -name '*.app' -o -name '*.appex' \) -print 2>/dev/null | head -100 || true
            exit 1
          fi
          APP="${APPS[0]}"
          echo "App bundle: $APP"

          PLIST="$APP/Info.plist"
          if [[ ! -f "$PLIST" ]]; then
            echo "::error::Info.plist is missing from $APP"
            exit 1
          fi
          plutil -lint "$PLIST"

          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$2"; }
          BUNDLE_ID="$(pb CFBundleIdentifier "$PLIST")"
          EXE="$(pb CFBundleExecutable "$PLIST")"
          PLATFORM="$(pb CFBundleSupportedPlatforms:0 "$PLIST")"
          MIN_OS="$(pb MinimumOSVersion "$PLIST")"
          VERSION="$(pb CFBundleShortVersionString "$PLIST")"
          BUILD="$(pb CFBundleVersion "$PLIST")"
          echo "CFBundleIdentifier=$BUNDLE_ID  CFBundleExecutable=$EXE  Platform=$PLATFORM  MinimumOSVersion=$MIN_OS  Version=$VERSION ($BUILD)"

          fail=0
          check() { if [[ "$1" != "$2" ]]; then echo "::error::$3: expected '$2', got '$1'"; fail=1; fi; }
          check "$BUNDLE_ID" "$EXPECTED_BUNDLE_ID" "CFBundleIdentifier"
          check "$PLATFORM" "iPhoneOS" "CFBundleSupportedPlatforms[0]"
          check "$MIN_OS" "$EXPECTED_MIN_OS" "MinimumOSVersion"
          # The Home Screen label. `CFBundleDisplayName` is optional in the
          # plist (iOS falls back to CFBundleName), so read it
          # defensively and fail loudly if it is missing or wrong.
          DISPLAY_NAME="$(pb CFBundleDisplayName "$PLIST" 2>/dev/null || true)"
          if [[ "$DISPLAY_NAME" != "$EXPECTED_DISPLAY_NAME" ]]; then
            echo "::error::CFBundleDisplayName: expected '$EXPECTED_DISPLAY_NAME', got '$DISPLAY_NAME'"
            fail=1
          fi
          echo "CFBundleDisplayName=$DISPLAY_NAME"
          if [[ ! "$BUILD" =~ ^[0-9]+$ ]]; then
            echo "::error::CFBundleVersion '$BUILD' is not a number (set_build_number.sh did not run?)"
            fail=1
          fi
          if [[ ! -f "$APP/$EXE" ]]; then
            echo "::error::Main executable '$EXE' is missing from the app bundle"
            fail=1
          else
            ARCHS="$(lipo -archs "$APP/$EXE")"
            echo "Executable architectures: $ARCHS"
            if [[ " $ARCHS " != *" arm64 "* ]]; then
              echo "::error::Executable is not arm64 (got: $ARCHS)"
              fail=1
            fi
          fi

          WIDGET="$APP/PlugIns/LocalGalleryWidgets.appex"
          if [[ ! -f "$WIDGET/Info.plist" ]]; then
            echo "::error::Widget extension is missing from the app bundle"
            fail=1
          else
            check "$(pb CFBundleIdentifier "$WIDGET/Info.plist")" "$EXPECTED_WIDGET_BUNDLE_ID" "Widget CFBundleIdentifier"
          fi

          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi

          {
            echo "APP=$APP"
            echo "EXE=$EXE"
            echo "VERSION=$VERSION"
            echo "BUILD=$BUILD"
          } >> "$GITHUB_ENV"

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          IPA_DIR="$GITHUB_WORKSPACE/build/ipa"
          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"
          ditto "$APP" "$IPA_DIR/Payload/LocalGallery.app"
          (cd "$IPA_DIR" && /usr/bin/zip -qry -X PixelPic.ipa Payload)
          ls -l "$IPA_DIR/PixelPic.ipa"

      - name: Verify IPA contents and report signing status
        shell: bash
        run: |
          set -euo pipefail
          IPA="$GITHUB_WORKSPACE/build/ipa/PixelPic.ipa"
          test -s "$IPA"
          unzip -tq "$IPA"

          LIST="$(unzip -Z1 "$IPA")"
          fail=0
          need() {
            if ! grep -qxF "$1" <<<"$LIST"; then
              echo "::error::IPA is missing $1"
              fail=1
            fi
          }
          need "Payload/LocalGallery.app/Info.plist"
          need "Payload/LocalGallery.app/$EXE"
          need "Payload/LocalGallery.app/PlugIns/LocalGalleryWidgets.appex/Info.plist"

          # Everything must live under exactly one Payload/<name>.app directory.
          TOPS="$(grep -oE '^Payload/[^/]+' <<<"$LIST" | sort -u)"
          if [[ "$TOPS" != "Payload/LocalGallery.app" ]]; then
            echo "::error::Unexpected top-level entries in IPA: $TOPS"
            fail=1
          fi
          if grep -qv '^Payload/' <<<"$LIST"; then
            echo "::error::IPA contains entries outside Payload/"
            fail=1
          fi

          # Re-read Info.plist from the packaged IPA itself, not from the build dir.
          TMP="$(mktemp -d)"
          unzip -q "$IPA" "Payload/LocalGallery.app/Info.plist" -d "$TMP"
          IPA_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$TMP/Payload/LocalGallery.app/Info.plist")"
          if [[ "$IPA_BUNDLE_ID" != "$EXPECTED_BUNDLE_ID" ]]; then
            echo "::error::IPA bundle id is '$IPA_BUNDLE_ID', expected '$EXPECTED_BUNDLE_ID'"
            fail=1
          fi
          # The label the user sees on the Home Screen, read from the
          # packaged IPA so the shipped bundle is what is checked.
          IPA_DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$TMP/Payload/LocalGallery.app/Info.plist" 2>/dev/null || true)"
          if [[ "$IPA_DISPLAY_NAME" != "$EXPECTED_DISPLAY_NAME" ]]; then
            echo "::error::IPA CFBundleDisplayName is '$IPA_DISPLAY_NAME', expected '$EXPECTED_DISPLAY_NAME'"
            fail=1
          fi

          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi

          SIZE="$(du -h "$IPA" | cut -f1)"
          SIGNING="$(codesign -dvv "$APP" 2>&1 || true)"
          echo "$SIGNING"

          {
            echo "## Pixel Pic IPA"
            echo
            echo "- File: \`PixelPic.ipa\` ($SIZE), version $VERSION ($BUILD)"
            echo "- Bundle id: \`$IPA_BUNDLE_ID\`, device build (iPhoneOS, arm64), min iOS $EXPECTED_MIN_OS"
            echo "- Home Screen name: \`$IPA_DISPLAY_NAME\`"
            echo "- Structure verified: \`Payload/LocalGallery.app\` with Info.plist, executable and widget extension"
            echo
            echo "**Signing status: UNSIGNED.** Built with code signing disabled. This is a valid package but it will"
            echo "**not install on an iPhone as-is**. It must be re-signed with a certificate and provisioning profile"
            echo "(or sideloaded with a tool that re-signs it) before installation."
            echo
            echo '```'
            echo "$SIGNING"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Runs only if every step above succeeded, so a published artifact has
      # always passed bundle and IPA validation.
      - name: Upload IPA
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: PixelPic-unsigned-IPA
          path: build/ipa/PixelPic.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: xcodebuild-log
          path: xcodebuild-build.log
          if-no-files-found: ignore
          retention-days: 14

  diag:
    if: ${{ inputs.mode == 'diag' }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "${{ env.XCODE_VERSION }}"

      - name: Install Rust toolchain and iOS targets
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # 2026-09-03
        with:
          toolchain: "1.97.1"
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          rustc --version
          cargo --version

      - name: Install pinned XcodeGen
        run: /bin/bash scripts/install_xcodegen.sh

      - name: Stage model pack (optional)
        run: /bin/bash scripts/prepare_pack.sh --optional

      - name: Build Rust bindings and XCFramework
        run: /bin/bash scripts/build_core.sh --release

      - name: Bisect - delete excluded files (optional)
        if: ${{ inputs.exclude_files != '' }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra FILES <<< "${{ inputs.exclude_files }}"
          for f in "${FILES[@]}"; do
            f="$(echo "$f" | xargs)"
            echo "Deleting $f"
            rm -f "$f"
          done

      - name: Generate Xcode project
        run: xcodegen

      - name: Compile (time-boxed to 15 minutes)
        shell: bash
        run: |
          ROOT="$GITHUB_WORKSPACE"
          DERIVED="$ROOT/build/DerivedData"
          rm -rf "$DERIVED"
          mkdir -p "$ROOT/build"
          # Pure-bash time box: this runner image has neither GNU timeout
          # nor gtimeout (run 39912615120 failed in 0s with
          # "timeout: command not found"), so xcodebuild runs in the
          # background and a watchdog loop enforces the 900s cap.
          set +e
          xcodebuild \
            -project "$ROOT/LocalGallery.xcodeproj" \
            -scheme LocalGallery \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED" \
            -showBuildTimingSummary \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_COMPILATION_MODE=singlefile \
            SWIFT_OPTIMIZATION_LEVEL=-Onone \
            OTHER_SWIFT_FLAGS="-debug-time-compilation -stats-output-dir $ROOT/build/swift-stats -Xfrontend -debug-time-function-bodies" \
            build > "$ROOT/xcodebuild-build.log" 2>&1 &
          XPID=$!
          ELAPSED=0
          XC=""
          while kill -0 "$XPID" 2>/dev/null; do
            if [ "$ELAPSED" -ge 900 ]; then
              echo "Time box reached (900s) - terminating xcodebuild"
              kill "$XPID" 2>/dev/null
              sleep 5
              pkill -9 -x swiftc 2>/dev/null
              pkill -9 -f swift-frontend 2>/dev/null
              kill -9 "$XPID" 2>/dev/null
              XC=124
              break
            fi
            sleep 15
            ELAPSED=$((ELAPSED+15))
          done
          if [ -z "$XC" ]; then wait "$XPID"; XC=$?; fi
          set -e
          echo "xcodebuild exit code: $XC (124 = killed by the 15-minute time box)"
          echo "### Diagnostic compile exit code: $XC" >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 "$ROOT/xcodebuild-build.log" || true
          # Roll up the per-invocation -stats-output-dir JSON files into
          # phase totals (AST / SILGen / SILOpt / IRGen / LLVM), so the
          # artifact shows where completed compiler jobs spent their time
          # even though the hanging job never writes its own stats file.
          python3 - "$ROOT/build/swift-stats" > "$ROOT/swift-stats-summary.txt" 2>&1 << 'PYEOF' || true
          import json, os, sys, collections
          root = sys.argv[1]
          totals = collections.Counter(); files = 0
          per_inv = []
          for dirpath, _, names in os.walk(root):
              for n in names:
                  if not n.endswith('.json'): continue
                  try: d = json.load(open(os.path.join(dirpath, n)))
                  except Exception: continue
                  files += 1
                  wall = 0.0
                  for k, v in d.items():
                      if k.startswith('Time.') and isinstance(v, (int, float)):
                          totals[k] += v
                          if k.endswith('.wall'): wall += v
                  per_inv.append((wall, n))
          print(f"stats files: {files}")
          print("phase totals (seconds, summed across invocations):")
          for k, v in totals.most_common(25): print(f"  {k}: {v:.2f}")
          print("slowest invocations by summed phase wall time:")
          for w, n in sorted(per_inv, reverse=True)[:15]: print(f"  {w:.2f}s  {n}")
          PYEOF
          cat "$ROOT/swift-stats-summary.txt" || true

      - name: Upload diagnostic build log
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: xcodebuild-diag-log
          path: |
            xcodebuild-build.log
            swift-stats-summary.txt
            build/swift-stats
          if-no-files-found: warn
          retention-days: 14
