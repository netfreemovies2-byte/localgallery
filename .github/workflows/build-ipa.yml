name: Build LocalGallery IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  LANGUAGE: en_US:en
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  XCODE_VERSION: "26.6"

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "${{ env.XCODE_VERSION }}"

      - name: Install Rust toolchain and iOS targets
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # 2026-09-03
        with:
          toolchain: "1.97.1"
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          rustc --version
          cargo --version
          git rev-parse --is-shallow-repository
          git rev-list --count HEAD

      - name: Install pinned XcodeGen
        run: /bin/bash scripts/install_xcodegen.sh

      - name: Stage model pack (optional)
        run: /bin/bash scripts/prepare_pack.sh --optional

      - name: Build Rust bindings and XCFramework
        run: /bin/bash scripts/build_core.sh --release

      - name: Generate Xcode project
        run: xcodegen

      - name: Archive unsigned iOS app
        run: |
          xcodebuild archive \
            -project LocalGallery.xcodeproj \
            -scheme LocalGallery \
            -destination "generic/platform=iOS" \
            -archivePath build/LocalGallery.xcarchive \
            -resultBundlePath ArchiveResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-archive.log

      - name: Package unsigned IPA
        run: |
          APP="build/LocalGallery.xcarchive/Products/Applications/LocalGallery.app"
          test -d "$APP"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/LocalGallery.app
          cd build/ipa
          /usr/bin/zip -qry LocalGallery-unsigned.ipa Payload
          test -s LocalGallery-unsigned.ipa
          echo "IPA created: $(pwd)/LocalGallery-unsigned.ipa"

      - name: Upload IPA and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LocalGallery-unsigned-IPA
          path: |
            build/ipa/LocalGallery-unsigned.ipa
            xcodebuild-archive.log
            ArchiveResults.xcresult
          if-no-files-found: warn
          retention-days: 14
